<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ticket Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <nav class="border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <a href="/" class="text-xl font-bold tracking-tight">🎟 Ticket Tracker</a>
    <div class="flex items-center gap-6">
      <a href="/settings" class="text-sm text-gray-400 hover:text-gray-100 transition">Settings</a>
      <a href="/alerts/history" class="text-sm text-gray-400 hover:text-gray-100 transition">Alert History</a>
      <span class="text-sm text-gray-500">Resale ticket price monitor</span>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Scrape progress overlay -->
  <style>
    @keyframes scrape-spin { to { transform: rotate(360deg); } }
  </style>
  <div id="scrape-overlay"
       style="display:none; position:fixed; inset:0; z-index:9999;
              background:rgba(0,0,0,0.6); align-items:center; justify-content:center;
              pointer-events:all;">
    <div style="background:#1f2937; border-radius:0.75rem; padding:2rem 2.5rem;
                width:22rem; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,0.6);">
      <div style="width:48px; height:48px; border:4px solid #374151;
                  border-top-color:#22c55e; border-radius:50%;
                  animation:scrape-spin 0.8s linear infinite;
                  margin:0 auto 1.25rem;"></div>
      <p id="scrape-status"
         style="color:#f9fafb; font-weight:500; font-size:0.95rem; margin-bottom:1rem;">
        Connecting to Ticketmaster...
      </p>
      <div style="background:#374151; border-radius:9999px; height:8px;
                  overflow:hidden; margin-bottom:0.75rem;">
        <div id="scrape-progress-bar"
             style="background:#22c55e; height:100%; width:0%;
                    border-radius:9999px; transition:width 0.5s ease;"></div>
      </div>
      <p style="color:#6b7280; font-size:0.75rem;">This usually takes 15–30 seconds</p>
    </div>
  </div>

  <script>
    (function () {
      var messages = [
        'Connecting to Ticketmaster...',
        'Loading ticket listings...',
        'Extracting prices...',
        'Almost done...'
      ];
      var msgIdx = 0;
      var progressVal = 0;
      var progressInterval = null;
      var messageInterval = null;

      window.startScrapeOverlay = function () {
        var overlay = document.getElementById('scrape-overlay');
        overlay.style.display = 'flex';
        document.body.style.pointerEvents = 'none';

        msgIdx = 0;
        progressVal = 0;
        document.getElementById('scrape-status').textContent = messages[0];
        document.getElementById('scrape-progress-bar').style.width = '0%';

        // 0% → 90% over ~20 s (tick every 200 ms)
        var tickMs = 200;
        var increment = 90 / (20000 / tickMs);
        clearInterval(progressInterval);
        progressInterval = setInterval(function () {
          progressVal = Math.min(progressVal + increment, 90);
          document.getElementById('scrape-progress-bar').style.width = progressVal + '%';
          if (progressVal >= 90) clearInterval(progressInterval);
        }, tickMs);

        clearInterval(messageInterval);
        messageInterval = setInterval(function () {
          msgIdx = (msgIdx + 1) % messages.length;
          document.getElementById('scrape-status').textContent = messages[msgIdx];
        }, 5000);
      };

      window.stopScrapeOverlay = function () {
        document.getElementById('scrape-overlay').style.display = 'none';
        document.body.style.pointerEvents = '';
        clearInterval(progressInterval);
        clearInterval(messageInterval);
      };
    })();
  </script>
</body>
</html>
